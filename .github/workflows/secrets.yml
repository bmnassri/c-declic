name: Audit des secrets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan historique et fichiers actuels
        shell: bash
        run: |
          set -eu
          image=ghcr.io/gitleaks/gitleaks:v8.24.2
          docker pull "$image"
          failed=0
          for scope in git dir; do
            args=()
            if [ "$scope" = git ]; then args+=(--log-opts="--all --full-history"); fi
            if docker run --rm --network none -v "$PWD:/repo:ro" "$image" "$scope" /repo --redact=100 --no-banner --ignore-gitleaks-allow "${args[@]}" >/dev/null 2>&1; then
              echo "$scope : aucune détection"
            else
              echo "::error::$scope : détection possible ou erreur du scanner. Examiner localement avec masquage intégral."
              failed=1
            fi
          done
          exit "$failed"
      - name: Vérifier les fichiers sensibles suivis
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, pathlib, sys
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          bad = []
          for f in files:
              p = pathlib.PurePosixPath(f)
              if (p.name == '.env' or p.name.startswith('.env.') and p.name != '.env.example' or p.suffix.lower() in {'.pem','.key','.p12','.pfx'}):
                  bad.append(f)
          if bad:
              print('Fichiers sensibles suivis :', len(bad))
              sys.exit(1)
          print('Aucun fichier sensible suivi selon les règles définies.')
          PY
