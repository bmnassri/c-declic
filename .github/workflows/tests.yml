name: Tests C-Declic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cd_test
          POSTGRES_PASSWORD: cd_test_only
          POSTGRES_DB: cd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cd_test -d cd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CDECLIC_INTEGRATION: '1'
      CDECLIC_TEST_DATABASE_URL: postgresql://cd_test:cd_test_only@127.0.0.1:5432/cd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --test test/integration.test.js
